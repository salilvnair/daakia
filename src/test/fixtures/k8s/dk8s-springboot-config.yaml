---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zp-config
  namespace: dk8s-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zp-config
  template:
    metadata:
      labels:
        app: zp-config
    spec:
      containers:
        - name: app
          image: eclipse-temurin:21-jre
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: zp-config-app
